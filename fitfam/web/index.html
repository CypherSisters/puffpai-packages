<html lang="en">
<head>

<title>FitFam</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { min-height: 100vh; min-height: 100dvh; }
  body {
    font-family: 'Segoe UI', 'Lucida Grande', 'Trebuchet MS', sans-serif; overscroll-behavior: none;
    background: linear-gradient(135deg, #0a1628 0%, #0c2340 15%, #0f3460 30%, #1a6b8a 50%, #2dabb5 65%, #72d6c9 80%, #a8edea 90%, #d4f5e6 100%);
    background-attachment: fixed; color: rgba(255,255,255,0.95); overflow-x: hidden;
  }
  input::placeholder { color: rgba(255,255,255,0.35); }
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }
  @keyframes floatUp { 0% { transform: translateY(0) scale(1); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 0.5; } 100% { transform: translateY(-110vh) scale(0.5); opacity: 0; } }
  @keyframes orbDrift { 0%, 100% { transform: translate(0, 0) scale(1); } 25% { transform: translate(30px, -20px) scale(1.1); } 50% { transform: translate(-20px, 30px) scale(0.95); } 75% { transform: translate(15px, 15px) scale(1.05); } }
  @keyframes bounceIn { 0% { transform: scale(0.3); opacity: 0; } 50% { transform: scale(1.05); } 70% { transform: scale(0.9); } 100% { transform: scale(1); opacity: 1; } }
  .fx { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
  .bubble { position: absolute; border-radius: 50%; animation: floatUp linear infinite; }
  .orb { position: absolute; border-radius: 50%; animation: orbDrift ease-in-out infinite; }
  #app { position: relative; z-index: 1; }
  .glass { background: rgba(255,255,255,0.12); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.25); border-radius: 20px; }
  .glass-light { background: rgba(255,255,255,0.2); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.3); border-radius: 16px; }
  .dim { color: rgba(255,255,255,0.6); }
  .btn { --c: #2dabb5; background: linear-gradient(180deg, color-mix(in srgb, var(--c) 87%, white) 0%, var(--c) 40%, color-mix(in srgb, var(--c) 73%, black) 100%);
    border: 1px solid rgba(255,255,255,0.3); border-radius: 14px; color: white; font-weight: 700; cursor: pointer; font-family: inherit;
    text-shadow: 0 1px 2px rgba(0,0,0,0.3); box-shadow: 0 4px 15px color-mix(in srgb, var(--c) 33%, transparent), inset 0 1px 0 rgba(255,255,255,0.4); transition: all 0.2s ease; }
  .btn.green { --c: #4ade80; }
  .btn-plain { background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.25); border-radius: 14px; color: rgba(255,255,255,0.8); font-weight: 600; cursor: pointer; font-family: inherit; }
  .btn-x { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); border-radius: 8px; padding: 4px 8px; cursor: pointer; color: #ef4444; font-size: 11px; font-weight: 700; font-family: inherit; }
  .btn-inc { background: rgba(45,171,181,0.2); border: 1px solid rgba(45,171,181,0.3); border-radius: 8px; padding: 4px 10px; cursor: pointer; color: #72d6c9; font-size: 11px; font-weight: 700; font-family: inherit; }
  .page { padding: 24px 16px 110px; max-width: 480px; margin: 0 auto; }
  h1 { font-size: 42px; font-weight: 800; letter-spacing: -1px; text-shadow: 0 2px 20px rgba(45,171,181,0.5); }
  h2 { font-size: 24px; font-weight: 800; margin-bottom: 4px; }
  h3 { font-size: 15px; font-weight: 700; margin-bottom: 12px; }
  .label { font-size: 13px; font-weight: 700; display: block; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat { padding: 16px 12px; text-align: center; }
  .stat b { font-size: 24px; font-weight: 800; display: block; }
  .stat span { font-size: 10px; margin-top: 4px; text-transform: uppercase; letter-spacing: 1px; color: rgba(255,255,255,0.6); }
  .choice { padding: 14px 12px; cursor: pointer; text-align: center; border-radius: 14px; border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.08); color: inherit; font-family: inherit; transition: all 0.2s; }
  .choice.on { border: 2px solid #2dabb5; background: rgba(45,171,181,0.2); }
  .row { display: flex; gap: 8px; }
  .bar { height: 8px; background: rgba(0,0,0,0.3); border-radius: 4px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: linear-gradient(90deg, #2dabb5, #72d6c9); border-radius: 4px; transition: width 0.5s; }
  .bar i.done { background: linear-gradient(90deg, #4ade80, #22c55e); }
  .item { padding: 12px 16px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; border-radius: 12px; }
  .ex { margin-bottom: 10px; border-radius: 14px; overflow: hidden; border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.08); transition: all 0.3s; }
  .ex.done { border-color: rgba(74,222,128,0.4); background: rgba(74,222,128,0.1); }
  .ex-head { padding: 14px 16px; display: flex; align-items: center; gap: 12px; cursor: pointer; }
  .tick { width: 28px; height: 28px; border-radius: 8px; border: 2px solid rgba(255,255,255,0.3); background: transparent; cursor: pointer; color: white; font-size: 14px; font-weight: 800; flex-shrink: 0; }
  .ex.done .tick { border-color: #4ade80; background: #4ade80; }
  .ex.done .ex-name { text-decoration: line-through; opacity: 0.6; }
  .nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 100; display: flex; justify-content: center; padding: 0 12px 12px; }
  .nav > div { display: flex; gap: 4px; padding: 8px 12px; max-width: 420px; width: 100%; justify-content: space-around; background: rgba(10,22,40,0.7); backdrop-filter: blur(30px); }
  .nav button { background: transparent; border: 1px solid transparent; border-radius: 12px; padding: 8px 16px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; font-family: inherit; }
  .nav button.on { background: rgba(45,171,181,0.3); border-color: rgba(45,171,181,0.4); }
  .nav button span { font-size: 20px; }
  .nav button small { font-size: 10px; font-weight: 600; color: rgba(255,255,255,0.5); }
  .nav button.on small { color: #72d6c9; }
  .top { position: sticky; top: 0; z-index: 50; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; background: rgba(10,22,40,0.5); backdrop-filter: blur(20px); }
  .field { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.25); color: white; font-size: 13px; font-family: inherit; }
  .days { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; }
  .days div { aspect-ratio: 1; border-radius: 6px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center; font-size: 9px; color: rgba(255,255,255,0.3); font-weight: 700; }
  .days div.hit { border-color: rgba(45,171,181,0.5); color: #72d6c9; }
  .toast { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); z-index: 200; padding: 10px 16px; border-radius: 12px; background: rgba(10,22,40,0.85); font-size: 13px; display: none; max-width: 90vw; }
  .center { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; }
</style>
</head>
<body>
<div class="fx" id="fx"></div>
<div id="app"><div class="center"><h2>Loading FitFam...</h2></div></div>
<div class="toast" id="toast"></div>
<script>
// FitFam's own server serves this page (through the Desktop's /pkg/fitfam/), so every call is relative to it.
const BASE = location.pathname.replace(/\/[^/]*\.[^/]*$/, '/').replace(/([^/])$/, '$1/');
const LS_KEY = 'fitfam_data_v2';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $app = document.getElementById('app');

let data = null, people = [], lib = null, who = null, screen = 'dashboard';
let active = null, completion = null, offline = false, stamp = '';
let setup = null, adding = false, expanded = null;
let elapsed = 0, restTime = 0, restDuration = 60, timer = null, restTimer = null;

// ─── EFFECTS (bubbles and hazy orbs, as in v1) ───
(function effects() {
  const fx = document.getElementById('fx');
  let html = '';
  for (let i = 0; i < 18; i++) {
    const size = 8 + Math.random() * 60, op = 0.04 + Math.random() * 0.1;
    html += `<div class="bubble" style="width:${size}px;height:${size}px;left:${Math.random()*100}%;bottom:${-size}px;` +
      `background:radial-gradient(circle at 30% 30%, rgba(255,255,255,${op+0.15}), rgba(255,255,255,${op*0.5}) 40%, rgba(100,220,255,${op}) 100%);` +
      `border:1px solid rgba(255,255,255,${op+0.05});animation-duration:${12+Math.random()*18}s;animation-delay:${Math.random()*15}s"></div>`;
  }
  html += '<div class="orb" style="width:400px;height:400px;top:-10%;right:-5%;background:radial-gradient(circle, rgba(45,171,181,0.25) 0%, transparent 70%);filter:blur(60px);animation-duration:20s"></div>';
  html += '<div class="orb" style="width:300px;height:300px;bottom:10%;left:-8%;background:radial-gradient(circle, rgba(114,214,201,0.2) 0%, transparent 70%);filter:blur(50px);animation-duration:25s;animation-direction:reverse"></div>';
  fx.innerHTML = html;
})();

function toast(text) {
  const t = document.getElementById('toast');
  t.textContent = text; t.style.display = 'block';
  clearTimeout(toast.t); toast.t = setTimeout(() => { t.style.display = 'none'; }, 3500);
}

// ─── TALKING TO FITFAM ───
async function getJSON(path) {
  const r = await fetch(BASE + path);
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || ('HTTP ' + r.status));
  return r.json();
}
function adopt(doc) {
  data = doc; stamp = doc.last_updated || '';
  try { localStorage.setItem(LS_KEY, JSON.stringify(doc)); } catch (e) {}
}
async function act(action, body) {
  if (offline) { toast('FitFam is not answering, so nothing was saved. Open it again from the PuffPAI Desktop.'); return false; }
  try {
    const r = await fetch(BASE + 'api/' + action, { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ person: who, ...body }) });
    const out = await r.json();
    if (!r.ok) { toast(out.error || 'That did not save.'); return false; }
    adopt(out.data); return true;
  } catch (e) { toast('FitFam is not answering, so nothing was saved.'); return false; }
}
async function load() {
  try {
    [lib, people] = await Promise.all([getJSON('exercises'), getJSON('people')]);
    adopt(await getJSON('data'));
    offline = false;
  } catch (e) {
    offline = true;
    try { data = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch (_) { data = null; }
    if (!data || !lib) { $app.innerHTML = '<div class="center"><h2>FitFam is not answering</h2><p class="dim" style="margin-top:8px">Open it again from the PuffPAI Desktop.</p></div>'; return; }
    toast('FitFam is not answering. This is the last copy this page saw, and nothing can be saved.');
  }
  if (people.length === 1) who = people[0].id;
  render();
}
// The brain can log workouts too: pick up its changes (not in the middle of a workout).
setInterval(async () => {
  if (offline || !data || screen === 'active' || screen === 'complete') return;
  try {
    const { last_updated } = await getJSON('updated');
    if (last_updated !== stamp) { adopt(await getJSON('data')); render(); }
  } catch (e) {}
}, 3000);

// ─── HELPERS ───
function user() {
  const p = people.find(x => x.id === who) || { name: who, emoji: '' };
  const u = data.users[who] || {};
  return { name: p.name, emoji: p.emoji, prefs: u.prefs || { level: 'mid', type: 'full', duration: 30 },
    goals: u.goals || [], history: u.history || [], sets: u.sets || [], totalWorkouts: u.totalWorkouts || 0 };
}
function streakOf(u) {
  const days = new Set([...u.history, ...u.sets].map(e => new Date(e.date).toDateString()));
  const d = new Date();
  if (!days.has(d.toDateString())) d.setDate(d.getDate() - 1);
  let n = 0;
  while (days.has(d.toDateString())) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
const typeLabel = id => (lib.types.find(t => t.id === id) || {}).label || id;
const typeEmoji = id => (lib.types.find(t => t.id === id) || {}).emoji || '⚡';
const two = n => String(n).padStart(2, '0');
const hName = h => h.typeName || h.type || 'Workout';
const setLoad = s => Number(s.weight) ? `${esc(s.weight)}${s.unit ? ' ' + esc(s.unit) : ''} x ${esc(s.reps)}` : `${esc(s.reps)} reps`;
const hDist = h => h.distance ? ` · ${esc(h.distance)} ${esc(h.distanceUnit || '')}` : '';
const levelName = l => (lib.levels[l] || l || '');
// The last 7 calendar days, today included: the same week the bot's "status" counts.
function thisWeek(u) {
  const from = new Date(); from.setHours(0, 0, 0, 0); from.setDate(from.getDate() - 6);
  return u.history.filter(h => new Date(h.date) >= from).length;
}

// ─── SCREENS ───
function render() {
  if (!data) return;
  if (!who) return renderPeople();
  if (screen === 'active') return renderActive();
  if (screen === 'complete') return renderComplete();
  const u = user();
  const body = { dashboard: renderDashboard, workout: renderSetup, progress: renderProgress, goals: renderGoals }[screen](u);
  $app.innerHTML = `<div class="top"><div style="display:flex;align-items:center;gap:8px"><b style="font-size:18px">FitFam</b>` +
    `<span class="dim">|</span><span>${esc(u.emoji)} ${esc(u.name)}</span></div>` +
    (people.length > 1 ? `<button class="btn-plain" style="padding:6px 14px;font-size:12px" onclick="who=null;screen='dashboard';render()">Switch person</button>` : '') +
    `</div>${body}${renderNav()}`;
}

function renderPeople() {
  $app.innerHTML = `<div class="center"><div style="margin-bottom:40px"><h1>FitFam</h1>` +
    `<p class="dim" style="font-size:15px;margin-top:8px;letter-spacing:2px;text-transform:uppercase">Family Fitness Hub</p></div>` +
    `<div style="display:flex;gap:20px;flex-wrap:wrap;justify-content:center">` +
    people.map(p => `<button class="glass" style="padding:32px 36px;cursor:pointer;min-width:180px;color:inherit;font-family:inherit;box-shadow:0 8px 32px rgba(0,0,0,0.3)" onclick="who=${esc(JSON.stringify(p.id))};screen='dashboard';render()">` +
      `<div style="font-size:56px;margin-bottom:12px">${esc(p.emoji || '🏃')}</div><div style="font-size:22px;font-weight:700">${esc(p.name)}</div></button>`).join('') +
    `</div><p class="dim" style="font-size:12px;margin-top:28px;max-width:360px">People come from the household list in PuffPAI.</p></div>`;
}

function renderNav() {
  const items = [['dashboard', '🏠', 'Home'], ['workout', '⚡', 'Workout'], ['progress', '📊', 'Progress'], ['goals', '🎯', 'Goals']];
  return `<div class="nav"><div class="glass">` + items.map(([id, icon, label]) =>
    `<button class="${screen === id ? 'on' : ''}" onclick="screen='${id}';render()"><span>${icon}</span><small>${label}</small></button>`).join('') + `</div></div>`;
}

function renderDashboard(u) {
  const today = new Date().toDateString();
  const workedOut = u.history.some(h => new Date(h.date).toDateString() === today);
  const week = thisWeek(u);
  const goal = u.goals.find(g => g.current < g.target);
  let html = `<div class="page"><div style="margin-bottom:24px"><h2 style="font-size:26px">Hey ${esc(u.name)} ${esc(u.emoji)}</h2>` +
    `<p class="dim" style="font-size:13px">${workedOut ? 'Great work today! 🔥' : 'Ready to train?'}</p></div>` +
    `<div class="grid3" style="margin-bottom:20px">` +
    [[streakOf(u) + '🔥', 'Streak'], [week, 'This week'], [u.totalWorkouts, 'Total']].map(([v, l]) =>
      `<div class="glass-light stat"><b>${v}</b><span>${l}</span></div>`).join('') + `</div>` +
    `<button class="btn" style="width:100%;padding:18px;font-size:17px;margin-bottom:16px" onclick="quickStart()">⚡ Quick Start (${u.prefs.duration} min ${esc(lib.levels[u.prefs.level] || u.prefs.level)})</button>` +
    `<button class="btn-plain" style="width:100%;padding:14px;font-size:14px" onclick="screen='workout';render()">🎛️ Customize Workout</button>`;
  if (goal) {
    const pct = Math.min(100, Math.round(goal.current / goal.target * 100));
    html += `<div class="glass-light" style="padding:18px;margin-top:20px"><div style="display:flex;justify-content:space-between;margin-bottom:10px">` +
      `<b style="font-size:14px">🎯 Active Goal</b><span class="dim" style="font-size:12px">${pct}%</span></div>` +
      `<div style="font-size:13px;margin-bottom:10px">${esc(goal.text)}</div><div class="bar"><i style="width:${pct}%"></i></div></div>`;
  }
  if (u.history.length) {
    html += `<div style="margin-top:20px"><h3>Recent Workouts</h3>` + u.history.slice(-3).reverse().map(h =>
      `<div class="glass-light item"><div><div style="font-size:13px;font-weight:600">${esc(hName(h))}</div>` +
      `<div class="dim" style="font-size:11px">${new Date(h.date).toLocaleDateString()} · ${esc(h.duration)} min${hDist(h)}${h.level ? ' · ' + esc(levelName(h.level)) : ''}</div></div>` +
      `<div style="font-size:13px;font-weight:700">${h.exerciseCount ? '✓ ' + esc(h.exerciseCount) + ' exercises' : ''}</div></div>`).join('') + `</div>`;
  }
  return html + `</div>`;
}

function renderSetup(u) {
  if (!setup || setup.who !== who) setup = { who, type: u.prefs.type, level: u.prefs.level, duration: u.prefs.duration };
  const icons = { easy: '🌱', mid: '🔥', challenging: '💀' }, colors = { easy: '#4ade80', mid: '#facc15', challenging: '#f87171' };
  const count = lib.durations[String(setup.duration)] || 5;
  return `<div class="page"><h2>Build Your Workout</h2><p class="dim" style="font-size:13px;margin-bottom:24px">Set it up and go, or save it as your Quick Start.</p>` +
    `<div style="margin-bottom:20px"><label class="label">Workout Type</label><div class="grid2" style="gap:8px">` +
    lib.types.map(t => `<button class="choice ${setup.type === t.id ? 'on' : ''}" onclick="setup.type='${t.id}';render()"><div style="font-size:24px">${t.emoji}</div><div style="font-size:12px;font-weight:600;margin-top:4px">${esc(t.label)}</div></button>`).join('') +
    `</div></div><div style="margin-bottom:20px"><label class="label">Intensity</label><div class="row">` +
    Object.entries(lib.levels).map(([k, label]) => `<button class="choice" style="flex:1;${setup.level === k ? `border:2px solid ${colors[k]};background:${colors[k]}22` : ''}" onclick="setup.level='${k}';render()">` +
      `<div style="font-size:20px">${icons[k]}</div><div style="font-size:12px;font-weight:700;margin-top:4px;color:${setup.level === k ? colors[k] : 'rgba(255,255,255,0.7)'}">${label}</div></button>`).join('') +
    `</div></div><div style="margin-bottom:28px"><label class="label">Duration</label><div class="row">` +
    Object.keys(lib.durations).map(d => `<button class="choice ${String(setup.duration) === d ? 'on' : ''}" style="flex:1" onclick="setup.duration=${d};render()"><div style="font-size:18px;font-weight:800">${d}</div><div class="dim" style="font-size:10px">min</div></button>`).join('') +
    `</div></div><div class="glass-light" style="padding:16px;margin-bottom:16px;border-radius:14px"><div class="dim" style="font-size:11px;margin-bottom:6px;text-transform:uppercase;letter-spacing:1px">Preview: about ${count} exercises</div>` +
    `<div style="font-size:14px">${typeEmoji(setup.type)} ${esc(typeLabel(setup.type))} · ${lib.levels[setup.level]} · ${setup.duration} min</div></div>` +
    `<div class="row" style="gap:10px"><button class="btn-plain" style="flex:1;padding:14px;font-size:13px" onclick="savePrefs()">💾 Save as Quick Start</button>` +
    `<button class="btn" style="flex:2;padding:14px;font-size:15px" onclick="startWorkout(setup.type, setup.level, setup.duration, true)">▶ Start Workout</button></div></div>`;
}

function renderActive() {
  const w = active, done = w.done.size, all = w.exercises.length;
  const pct = all ? done / all * 100 : 0;
  let html = `<div class="page"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">` +
    `<button class="btn-plain" style="background:none;border:none;font-size:14px" onclick="cancelWorkout()">← Back</button>` +
    `<b style="font-size:20px" id="clock">${two(Math.floor(elapsed / 60))}:${two(elapsed % 60)}</b></div>` +
    `<h2 style="font-size:20px">${esc(w.label)}</h2><p class="dim" style="font-size:12px;margin-bottom:16px">${done}/${all} complete · ${esc(lib.levels[w.level])}</p>` +
    `<div class="bar" style="height:6px;margin-bottom:12px"><i style="width:${pct}%"></i></div>`;
  if (restTime > 0) {
    html += `<div class="glass-light" style="padding:16px;margin-bottom:16px;text-align:center;border-radius:14px;border-color:rgba(45,171,181,0.4)">` +
      `<div class="dim" style="font-size:11px;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px">Rest Timer</div>` +
      `<b style="font-size:32px" id="rest">${two(Math.floor(restTime / 60))}:${two(restTime % 60)}</b><br>` +
      `<button class="btn" style="padding:6px 18px;font-size:12px;margin-top:8px" onclick="skipRest()">Skip Rest</button></div>`;
  } else if (done > 0 && done < all) {
    html += `<div class="row" style="gap:6px;margin-bottom:12px;justify-content:center;align-items:center"><span class="dim" style="font-size:11px">Rest:</span>` +
      [30, 60, 90, 120].map(s => `<button class="btn-inc" style="${restDuration === s ? 'background:rgba(45,171,181,0.45)' : ''}" onclick="restDuration=${s};startRest()">${s}s</button>`).join('') + `</div>`;
  }
  html += w.exercises.map((ex, i) => `<div class="ex ${w.done.has(i) ? 'done' : ''}"><div class="ex-head" onclick="expanded=expanded===${i}?null:${i};renderActive()">` +
    `<button class="tick" onclick="event.stopPropagation();toggle(${i})">${w.done.has(i) ? '✓' : ''}</button>` +
    `<div style="flex:1"><div class="ex-name" style="font-size:14px;font-weight:700">${esc(ex.name)}</div>` +
    `<div style="color:#72d6c9;font-size:12px;font-weight:600;margin-top:2px">${esc(ex.prescription)}</div></div>` +
    `<span class="dim" style="font-size:12px">${expanded === i ? '▲' : '▼'}</span></div>` +
    (expanded === i ? `<div style="padding:0 16px 14px 56px"><div class="dim" style="font-size:12px;line-height:1.6">${esc(ex.desc)}</div>` +
      `<div class="dim" style="font-size:11px;margin-top:6px">Target: ${esc(ex.muscle)} · about ${esc(ex.time)} min</div></div>` : '') + `</div>`).join('');
  if (done === all && all) html += `<button class="btn green" style="width:100%;padding:16px;font-size:16px;margin-top:16px" onclick="completeWorkout()">🎉 Complete Workout!</button>`;
  else if (done > 0) html += `<button class="btn-plain" style="width:100%;padding:14px;font-size:13px;margin-top:12px" onclick="completeWorkout()">Finish Early (${done}/${all} done)</button>`;
  $app.innerHTML = html + `</div>`;
}

function renderComplete() {
  const c = completion;
  $app.innerHTML = `<div class="center"><div style="font-size:80px;margin-bottom:16px;animation:bounceIn 0.6s ease">🎉</div>` +
    `<h1 style="font-size:32px;margin-bottom:8px">Workout Complete!</h1><p class="dim" style="font-size:15px;margin-bottom:32px">Great work on that ${esc(c.label)} session.</p>` +
    `<div class="row" style="gap:16px;margin-bottom:32px"><div class="glass-light stat" style="padding:16px 24px"><b style="font-size:28px">${Math.floor(c.elapsed / 60)}m ${c.elapsed % 60}s</b><span>Duration</span></div>` +
    `<div class="glass-light stat" style="padding:16px 24px"><b style="font-size:28px">${c.count}</b><span>Exercises</span></div></div>` +
    `<button class="btn" style="padding:16px 48px;font-size:16px" onclick="completion=null;screen='dashboard';render()">Back to Home</button></div>`;
}

function renderProgress(u) {
  const days = [];
  for (let i = 29; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i);
    const n = [...u.history, ...u.sets].filter(h => new Date(h.date).toDateString() === d.toDateString()).length;
    days.push(`<div class="${n ? 'hit' : ''}" style="${n ? `background:rgba(45,171,181,${Math.min(0.3 + n * 0.3, 1)})` : ''}">${d.getDate()}</div>`);
  }
  const minutes = u.history.reduce((a, h) => a + (Number(h.duration) || 0), 0);
  const exercises = u.history.reduce((a, h) => a + (Number(h.exerciseCount) || 0), 0);
  const byType = {};
  u.history.forEach(h => { byType[hName(h)] = (byType[hName(h)] || 0) + 1; });
  const top = Object.entries(byType).sort((a, b) => b[1] - a[1])[0];
  let html = `<div class="page"><h2>Progress</h2><p class="dim" style="font-size:13px;margin-bottom:20px">Your training at a glance.</p><div class="grid2" style="margin-bottom:20px">` +
    [[u.totalWorkouts, 'Total workouts'], [minutes, 'Total minutes'], [exercises, 'Exercises done'], [streakOf(u) + ' 🔥', 'Current streak']].map(([v, l]) =>
      `<div class="glass-light stat"><b style="font-size:22px">${v}</b><span>${l}</span></div>`).join('') +
    `</div><div class="glass-light" style="padding:16px;margin-bottom:20px"><h3 style="font-size:14px">Last 30 Days</h3><div class="days">${days.join('')}</div></div>`;
  if (top) html += `<div class="glass-light" style="padding:16px;margin-bottom:20px"><b style="font-size:14px">Most Trained</b><div style="font-size:18px;font-weight:800">${esc(top[0])}</div><div class="dim" style="font-size:12px">${top[1]} session${top[1] > 1 ? 's' : ''}</div></div>`;
  if (u.history.length) {
    html += `<div class="glass-light" style="padding:16px"><h3 style="font-size:14px">Workout History</h3>` + u.history.map((h, i) => [h, i]).reverse().map(([h, i]) =>
      `<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.08)"><div>` +
      `<div style="font-size:13px;font-weight:600">${esc(hName(h))}</div><div class="dim" style="font-size:11px">${new Date(h.date).toLocaleDateString()} · ${esc(h.duration || 0)} min${hDist(h)}${h.exerciseCount ? ' · ' + esc(h.exerciseCount) + ' exercises' : ''}</div></div>` +
      `<button class="btn-x" onclick="if(confirm('Remove this workout?'))act('remove_workout',{index:${i}}).then(render)">✕</button></div>`).join('') + `</div>`;
  } else {
    html += `<div class="glass-light" style="padding:32px;text-align:center"><div style="font-size:40px;margin-bottom:12px">🌟</div><b style="font-size:15px">No workouts yet</b><div class="dim" style="font-size:13px;margin-top:6px">Finish a workout, or tell the bot about one, to start tracking.</div></div>`;
  }
  if (u.sets.length) {
    html += `<div class="glass-light" style="padding:16px;margin-top:20px"><h3 style="font-size:14px">Recent Sets</h3>` + u.sets.slice(-10).reverse().map(s =>
      `<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.08);font-size:13px"><span>${esc(s.exercise || s.exerciseId)}</span>` +
      `<span style="display:flex;align-items:center;gap:8px"><span class="dim">${setLoad(s)}${s.rpe ? ' · RPE ' + esc(s.rpe) : ''} · ${new Date(s.date).toLocaleDateString()}</span>` +
      (s.id ? `<button class="btn-x" onclick="if(confirm('Remove this set?'))act('remove_set',{id:${esc(JSON.stringify(String(s.id)))}}).then(render)">✕</button>` : '') +
      `</span></div>`).join('') + `</div>`;
  }
  return html + `</div>`;
}

function renderGoals(u) {
  let html = `<div class="page"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px"><div><h2>Goals</h2>` +
    `<p class="dim" style="font-size:13px">Milestones to reach</p></div><button class="btn" style="padding:10px 16px;font-size:13px" onclick="adding=!adding;render()">+ Add Goal</button></div>`;
  if (adding) {
    html += `<div class="glass-light" style="padding:16px;margin-bottom:16px"><input class="field" id="gText" placeholder="Goal, like 20 push-ups in a row" style="margin-bottom:8px">` +
      `<div class="row"><input class="field" id="gTarget" type="number" min="1" placeholder="Target number"><select class="field" id="gUnit">` +
      ['reps', 'seconds', 'minutes', 'days', 'sessions', '% ROM', 'lbs', 'kg', 'mi', 'km'].map(x => `<option>${x}</option>`).join('') +
      `</select></div><button class="btn green" style="width:100%;padding:10px;font-size:13px;margin-top:10px" onclick="addGoal()">Save Goal</button></div>`;
  }
  if (!u.goals.length && !adding) html += `<div class="glass-light dim" style="padding:24px;text-align:center">No goals yet. Add one here, or tell the bot.</div>`;
  html += u.goals.map(g => {
    const pct = Math.min(100, Math.round(g.current / g.target * 100)), done = pct >= 100;
    return `<div class="glass-light" style="padding:16px;margin-bottom:12px;border-radius:14px;${done ? 'border-color:rgba(74,222,128,0.4)' : ''}">` +
      `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><b style="font-size:14px">${done ? '🏆 ' : '🎯 '}${esc(g.text)}</b>` +
      `<span style="color:${done ? '#4ade80' : '#72d6c9'};font-size:13px;font-weight:800">${pct}%</span></div>` +
      `<div class="bar" style="margin-bottom:10px"><i class="${done ? 'done' : ''}" style="width:${pct}%"></i></div>` +
      `<div style="display:flex;align-items:center;justify-content:space-between"><span class="dim" style="font-size:12px">${esc(g.current)} / ${esc(g.target)} ${esc(g.unit)}</span>` +
      `<div class="row" style="gap:6px">` + (done ? '' : [1, 5, 10].map(n => `<button class="btn-inc" onclick="act('update_goal',{goal:${esc(JSON.stringify(String(g.id)))},current:${Math.min(g.target, g.current + n)}}).then(render)">+${n}</button>`).join('')) +
      `<button class="btn-x" onclick="if(confirm('Delete this goal?'))act('remove_goal',{goal:${esc(JSON.stringify(String(g.id)))}}).then(render)">✕</button></div></div></div>`;
  }).join('');
  return html + `</div>`;
}

// ─── ACTIONS ───
async function savePrefs() {
  if (await act('save_prefs', { type: setup.type, level: setup.level, duration: setup.duration })) toast('Saved as your Quick Start.');
  render();
}
function quickStart() { const u = user(); startWorkout(u.prefs.type, u.prefs.level, u.prefs.duration, false); }
async function startWorkout(type, level, minutes, save) {
  if (save) await act('save_prefs', { type, level, duration: minutes });
  try {
    const w = await getJSON(`suggest?person=${encodeURIComponent(who)}&type=${encodeURIComponent(type)}&level=${encodeURIComponent(level)}&minutes=${minutes}`);
    active = { ...w, done: new Set() };
  } catch (e) { toast('FitFam could not make that workout: ' + e.message); return; }
  elapsed = 0; restTime = 0; expanded = null; screen = 'active';
  clearInterval(timer);
  timer = setInterval(() => { elapsed++; const c = document.getElementById('clock'); if (c) c.textContent = `${two(Math.floor(elapsed / 60))}:${two(elapsed % 60)}`; }, 1000);
  renderActive();
}
function toggle(i) {
  if (active.done.has(i)) active.done.delete(i); else { active.done.add(i); startRest(); }
  renderActive();
}
function startRest() {
  restTime = restDuration; clearInterval(restTimer);
  restTimer = setInterval(() => {
    restTime = Math.max(0, restTime - 1);
    const r = document.getElementById('rest');
    if (restTime === 0) { clearInterval(restTimer); renderActive(); }
    else if (r) r.textContent = `${two(Math.floor(restTime / 60))}:${two(restTime % 60)}`;
  }, 1000);
  renderActive();
}
function skipRest() { restTime = 0; clearInterval(restTimer); renderActive(); }
function stopClocks() { clearInterval(timer); clearInterval(restTimer); restTime = 0; }
function cancelWorkout() { stopClocks(); active = null; screen = 'dashboard'; render(); }
async function completeWorkout() {
  stopClocks();
  const w = active;
  const ok = await act('complete_workout', { typeName: w.label, level: w.level, duration: w.minutes, exerciseCount: w.exercises.length, elapsed });
  if (!ok) { screen = 'active'; return; }
  completion = { label: w.label, elapsed, count: w.exercises.length };
  active = null; screen = 'complete'; render();
}
async function addGoal() {
  const text = document.getElementById('gText').value.trim(), target = Number(document.getElementById('gTarget').value);
  if (!text || !(target > 0)) { toast('A goal needs words and a target number.'); return; }
  if (await act('add_goal', { goal: text, target, unit: document.getElementById('gUnit').value })) adding = false;
  render();
}

load();
</script>
